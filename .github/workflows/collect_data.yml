name: 부동산 데이터 수집 (수동 전용)

# 2026-09-09: 주간 예약 실행(cron)을 껐다.
#
# GitHub Actions 러너에서 apis.data.go.kr 로 TCP 접속이 안 된다 —
# 모든 요청이 ConnectTimeoutError(connect timeout=20)로 죽고, 20초×3회 재시도
# 때문에 6개 지역×3개월 36콜이 30분 job 타임아웃을 넘겨 취소된다.
# (8/10 실행은 1분 33초에 성공했으므로 그 사이 data.go.kr 쪽이 바뀐 것으로 보인다.
#  같은 API가 국내망 PC에서는 정상 응답한다.)
#
# 그래서 정기 수집은 Windows 작업 스케줄러 → scripts/run_scheduled_refresh.bat
# (국내 IP)로 옮겼다. 이 워크플로는 나중에 data.go.kr 접근이 복구되는지
# 확인해 볼 때를 위해 수동 실행만 남겨둔다.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realestate-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv "SQLAlchemy>=2.0" pandas numpy xmltodict tqdm pydantic statsmodels openpyxl

      - name: DB 초기화
        run: python scripts/init_db.py
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}

      - name: 데이터 수집 (주요 6개 지역, 최근 3개월)
        run: |
          python scripts/collect_data.py \
            --regions 11680,11650,11710,11440,11170,41135 \
            --months 3
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}

      - name: 요약 CSV 내보내기
        run: python scripts/export_summary.py
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/exports/
          git diff --cached --quiet || \
            git commit -m "data: 자동 갱신 $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
